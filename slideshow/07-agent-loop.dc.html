    if (this._ctxTimer) clearInterval(this._ctxTimer);
    if (this._ctxIo) this._ctxIo.disconnect();
    if (this._plIo) this._plIo.disconnect();
    if (this._hbIo) this._hbIo.disconnect();
    if (this._skIo) this._skIo.disconnect();
    if (this._rvIo) this._rvIo.disconnect();
    if (this._agIo) this._agIo.disconnect();
    if (this._io) this._io.disconnect();
    if (this._sweep) {
      window.removeEventListener('scroll', this._sweep);
      window.removeEventListener('hashchange', this._sweep);
    }
  }
  _enter(sec) {
    const A = window.anime;
    if (!A || !sec || this._reduce || sec === this._last) return;
    this._last = sec;
    const { animate, stagger } = A;
    (this._splits || []).forEach((sp) => { try { sp.revert(); } catch (e) {} });
    this._splits = [];
    (this._running || []).forEach((a) => { try { a.complete(); } catch (e) {} });
    const run = [];
    const go = (t, p) => { if (t && (!t.length || t.length > 0)) { const a = animate(t, p); run.push(a); } };
    const q = (sel) => Array.from(sec.querySelectorAll(sel));
    go(q('[data-a="eyebrow"]'), { opacity: [0, 1], x: [-28, 0], duration: 800, ease: 'outExpo' });
    q('h1,h2').forEach((h) => {
      let words = null;
      try {
        if (A.splitText) { const sp = A.splitText(h, { words: { wrap: 'clip' } }); this._splits.push(sp); words = sp.words && sp.words.length ? sp.words : null; }
      } catch (e) { words = null; }
      if (words) go(words, { y: ['110%', '0%'], duration: 950, delay: stagger(42, { start: 120 }), ease: 'outExpo' });
      else go([h], { opacity: [0, 1], y: [30, 0], duration: 900, ease: 'outExpo' });
    });
    go(q('[data-a="lede"]'), { opacity: [0, 1], y: [22, 0], duration: 900, delay: stagger(90, { start: 480 }), ease: 'outQuart' });
    const cards = q('[data-a="card"],[data-a="row"],[data-a="cta"]');
    go(cards, { opacity: [0, 1], y: [46, 0], duration: 1000, delay: stagger(85, { start: 340 }), ease: 'outBack(1.15)' });
    go(q('[data-a="photo"]'), { opacity: [0, 1], scale: [1.07, 1], duration: 1500, delay: stagger(160, { start: 150 }), ease: 'outExpo' });
    q('[data-a="count"]').forEach((el, i) => {
      const fin = el.dataset.final || (el.dataset.final = el.textContent);
      const m = fin.match(/[\d.,]+/);
      if (!m) return;
      const num = parseFloat(m[0].replace(/,/g, ''));
      const dec = (m[0].split('.')[1] || '').length;
      const pre = fin.slice(0, m.index), post = fin.slice(m.index + m[0].length);
      const o = { v: 0 };
      el.textContent = pre + (dec ? (0).toFixed(dec) : '0') + post;
      run.push(animate(o, { v: num, duration: 1700, delay: 420 + i * 130, ease: 'outExpo',
        onUpdate: () => { el.textContent = pre + (dec ? o.v.toFixed(dec) : Math.round(o.v).toLocaleString('en-US')) + post; },
        onComplete: () => { el.textContent = fin; } }));
    });
    const stage = sec.querySelector('[data-a="stage"]');
    if (stage) {
      go([stage], { opacity: [0, 1], y: [26, 0], duration: 800, ease: 'outExpo' });
      const svg = stage.querySelector('svg');
      if (svg) {
        const nodes = Array.from(svg.querySelectorAll('g[data-n],g[data-rn],g[data-sn],g[data-hn],g[data-pn],g[data-wn]'));
        nodes.forEach((g) => { g.style.transformBox = 'fill-box'; g.style.transformOrigin = 'center'; });
        go(nodes, { opacity: [0, 1], scale: [0.9, 1], duration: 750, delay: stagger(38, { start: 320 }), ease: 'outBack(1.4)' });
        go(Array.from(svg.querySelectorAll('path[data-c],path[data-rc],path[data-sc],path[data-hc],path[data-pc],path[data-wc],:scope > text')),
          { opacity: [0, 1], duration: 700, delay: stagger(14, { start: 560 }), ease: 'outQuad' });
      }
    }
    go(q('[data-a="cap"],[data-a="ctrl"]'), { opacity: [0, 1], y: [22, 0], duration: 850, delay: stagger(110, { start: 620 }), ease: 'outQuart' });
    this._running = run;
  }
  _capWatch() {
    const sel = ['cap', 'rcap', 'scap', 'hcap', 'pcap', 'wcap'].map((p) => '[data-' + p + '-title],[data-' + p + '-body]').join(',');
    document.querySelectorAll('[data-a="cap"]').forEach((cap) => {
      let pending = false;
      new MutationObserver(() => {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          const A = window.anime;
          if (!A || this._reduce) return;
          A.animate(Array.from(cap.querySelectorAll(sel)), { opacity: [0, 1], y: [14, 0], duration: 600, delay: A.stagger(80), ease: 'outQuart' });
        });
      }).observe(cap, { childList: true, subtree: true, characterData: true });
    });
  }
  _pulse() {
    const A = window.anime;
    const dot = document.querySelector('[data-a="pulse"]');
    if (!A || !dot || this._reduce) return;
    A.animate(dot, { scale: [1, 1.7, 1], opacity: [1, 0.55, 1], duration: 2400, loop: true, ease: 'inOutSine' });
  }
  renderVals() { return {}; }
}
